name: Android apps

# Publishing a release or pushing a version tag (v*) builds dx.bi TV (Android TV) and dx.bi for Android phones,
# and attaches dxbi-tv.apk, dxbi-mobile.apk, dxbi.plugin.js, and dxbi.theme.css to that release.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure signing key
        run: |
          if [ -n "${{ secrets.DXBI_TV_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DXBI_TV_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dxbi-tv.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/dxbi-tv.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=${{ secrets.DXBI_TV_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f release.keystore ]; then
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=dxbi1234" >> $GITHUB_ENV
          fi

      - name: Build
        run: |
          ./gradlew assembleTvRelease assembleMobileRelease --no-daemon
          cp app/build/outputs/apk/tv/release/app-tv-release.apk dxbi-tv.apk
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk dxbi-mobile.apk
        env:
          DXBI_TV_KEYSTORE: ${{ env.KEYSTORE_PATH }}
          DXBI_TV_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          DXBI_TV_KEY_ALIAS: dxbi-tv
          DXBI_TV_KEY_PASSWORD: ${{ env.KEYSTORE_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: dxbi-android
          path: |
            tv/dxbi-tv.apk
            tv/dxbi-mobile.apk
          if-no-files-found: error

      - name: Prepare Release Assets
        run: |
          cp ../dxbi.plugin.js ./dxbi.plugin.js
          cp ../dxbi.theme.css ./dxbi.theme.css

      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v$(cat ../app/version)"
          fi
          gh release upload "$TAG" dxbi-tv.apk dxbi-mobile.apk dxbi.plugin.js dxbi.theme.css --clobber || gh release create "$TAG" dxbi-tv.apk dxbi-mobile.apk dxbi.plugin.js dxbi.theme.css --title "$TAG" --notes "Release $TAG"
        env:
          GH_TOKEN: ${{ github.token }}
